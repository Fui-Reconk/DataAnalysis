# ============================================================
# 数据匹配与统计工具 - 全局配置
# 修改本文件后重启应用生效；删除本文件会回退到代码内置默认值。
# 颜色支持 (浅色模式,深色模式) 二元组，写法：#RRGGBB,#RRGGBB
# 行首 # / ; 为注释。
# ============================================================

[app]
# 外观模式：system（跟随系统）/ light / dark
appearance_mode = system
# 主题色：blue / green / dark-blue
color_theme = blue
# 主窗口尺寸（像素）
window_width = 1000
window_height = 680
window_min_width = 900
window_min_height = 600
# 应用标题与副标题
title = 数据匹配与统计工具
subtitle = Excel 多表左连接匹配 · 动态过滤 · 统计导出

[sidebar]
# 展开宽度（默认状态 / 半透明浮层展开宽度）
width = 210
# 折叠宽度（点击开合按钮后的窄图标栏宽度）
collapsed_width = 56
# 顶部标题区固定占位高度（折叠时内容隐藏但占位保留，导航图标Y轴不变）
header_height = 150
# 每个导航项占位高度 / 上下间距
nav_row_height = 44
nav_row_pady = 4
# 展开时图标与文字的间距
nav_icon_text_gap = 10
# 底部开合按钮箭头（展开 / 折叠）
toggle_expanded = ◀
toggle_collapsed = ▶
# 半透明浮层：窗口透明度（0~1，越小越透明）
overlay_alpha = 0.9
# 浮层淡入/淡出动画：步数 / 每步间隔（毫秒）
overlay_anim_steps = 8
overlay_anim_interval = 12

[nav]
# 未激活项文字 / 悬停背景 / 激活项文字 / 副标题（均为 浅色,深色 二元组）
text_color = #222831,#E8EAF0
hover_color = #A9B4C2,#3E4754
active_text_color = #FFFFFF
subtitle_color = #5A6472,#9AA4B2

[font]
# 字体格式：family,size[,weight]
title = Microsoft YaHei UI,18,bold
nav = Microsoft YaHei UI,13
body = Microsoft YaHei UI,12
small = Microsoft YaHei UI,11

[status]
ready = 就绪
busy = 处理中，请稍候…

[stats]
placeholder_text = 默认统计项：预留（请在代码 calculate_default_stats 中自定义）

[files]
# 文件对话框可选类型（label:pattern，多个用逗号分隔）
excel_types = Excel 文件:*.xlsx *.xls,DBF 文件:*.dbf,所有文件:*.*

[log]
# 错误/运行日志：写入项目根目录 logs/app.log（1MB×3 自动轮转）
enabled = true
level = INFO

[column_map]
# 原始数据列名为中文拼音首字缩写，右键菜单「替换缩写」按本表替换为全称。
# 如有不准，直接修改本段即可（键 = 缩写，值 = 中文全称）。
nd = 年度
kslb = 考试类别
zkzh = 准考证号
xm = 姓名
zjlx = 证件类型
zjhm = 证件号码
kmdm = 科目代码
kmmc = 科目名称
hgzbh = 合格证编号
kc1mc = 课程1名称
kc1cj = 课程1成绩
kc1bfw = 课程1补分位
kc2mc = 课程2名称
kc2cj = 课程2成绩
kc2bfw = 课程2补分位
xb = 性别
csrq = 出生日期
mzm = 民族码
mzmc = 民族名称
zzmmdm = 政治面貌代码
zzmmmc = 政治面貌名称
xsxwlbdm = 学生学位类别代码
xsxwlbmc = 学生学位类别名称
xsxwsyny = 学生学位授予年限
gzsjlxdh = 工作时间联系电话
fgzsjlxdh = 非工作时间联系电话
yddh = 移动电话
xwsydwm = 学位授予单位代码
xwsydwmc = 学位授予单位名称
cjfbrq = 成绩发布日期
wjbz = 违纪标志
wjjl = 违纪记录
sqbh = 申请编号
zydm = 专业代码
zymc = 专业名称

[dialog]
# 工作表多选对话框尺寸（像素）
sheet_picker_width = 400
sheet_picker_height = 460

[file_list]
# 文件加载页工作表行配色（浅色,深色 二元组）
# 未选中行文字（高对比，默认接近纯黑/纯白）
text_color = #1A1A1A,#F2F2F2
# 路径小字（次级信息，仍需可读）
subtext_color = #5A6472,#AEB6C2
# 未选中行悬停背景
hover_color = #D5DCE4,#39424F
# 选中态：行背景跟随主题色（蓝/绿）、文字白色，对比最明显，无需单独配置

[preview]
# 数据预览：显示每个工作表的前几行
rows = 20
# 导入后是否自动弹出预览
auto_show = true
# 多表一次导入时自动弹出的预览数量（全部非模态、级联排列，可独立关闭/置前）
auto_show_count = 2
# 右键「替换缩写」完成后是否自动弹出预览（便于确认新列名；数量同上）
auto_show_after_replace = true
# 执行匹配完成后是否自动弹出结果预览（便于核对合并后的列与行数）
auto_show_after_merge = true
# 应用过滤完成后是否自动弹出结果预览（便于核对过滤后的数据）
auto_show_after_filter = true
# 调整显示列（隐藏列）完成后是否自动弹出当前数据预览
auto_show_after_columns = true
# 预览窗口尺寸（像素；高度会按内容自适应收缩，消除底部空白）
dialog_width = 680
dialog_height = 480

[context_menu]
# 批量操作二次确认阈值：选中数超过该值时，
# 打开/预览/重载/删除 需弹窗确认后才执行
multi_confirm_threshold = 5
# 「在文件夹中显示」按文件数计数的确认阈值（默认同 multi_confirm_threshold）
folder_confirm_threshold = 5

[merge]
# 匹配完成后自动清理冗余列（仅删除非基准表的列，基准表自身列永不删除）：
#   - 全空列（全部为 NaN / 空字符串）
#   - 与基准表同名的重复列（如 姓名_2 与基准表 姓名）：该列有值的每一行都与
#     基准表相同即可删（左连接未匹配行的空值不计为差异；若该列含有基准表没有
#     的新数据则保留）
auto_clean = true
